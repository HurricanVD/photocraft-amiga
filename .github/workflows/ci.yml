name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      fuzz:
        description: "Run the fuzz job"
        type: boolean
        default: false
      fuzz_seconds:
        description: "Seconds per fuzz target"
        default: "600"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Debug and test builds keep line tables (file:line in panic backtraces) but drop the rest of the
  # debug info: faster codegen and links (Windows PDBs most of all), and a target dir small enough
  # for the Linux job's second, craft-fonts build (it ran out of disk with full debug info).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# A newer push to a PR branch cancels its older run. Runs on main are never cancelled: a merge
# that lands while main's run is in progress waits for it, so every main state that gets a run is
# checked to the end. (Cancelling here left main unverified whenever merges came close together.)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which OSes the test job runs on. main, manual runs and PRs labelled `full-ci` get all three.
  # Other PRs get Linux, plus macOS and Windows when they touch code whose behaviour differs by
  # platform: the app shell, UI, text and fonts, GPU, pen input, build scripts or the lockfile.
  platforms:
    name: select platforms
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.pick.outputs.os }}
      port: ${{ steps.pick.outputs.port }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          FULL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          all='["ubuntu-latest","macos-latest","windows-latest"]'
          # A separate, pinned GCC13 + vamos lane is needed when the isolated
          # Amiga port or its original Rust semantic oracle changes.
          # On main pushes the dedicated amigaos3-host.yml workflow owns
          # the native gates; avoid running the expensive GCC13 image twice.
          # Manual root CI dispatches still run the full portable/native lane.
          if [ "$EVENT" = workflow_dispatch ]; then
            echo 'port=true' >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" != pull_request ]; then
            echo 'port=false' >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" HEAD | grep -Eq '^(ports/amigaos3/|crates/(doc|raster|color|geom)/|\.github/workflows/(amigaos3-host|ci)\.yml$)'; then
            echo 'port=true' >> "$GITHUB_OUTPUT"
          else
            echo 'port=false' >> "$GITHUB_OUTPUT"
          fi
          if [ "$EVENT" != pull_request ] || [ "$FULL" = true ]; then
            echo "os=$all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -Eq '^(apps/|crates/(ui-egui|text|gpu|tablet|heif)/|Cargo\.lock$|(.*/)?build\.rs$|\.github/workflows/ci\.yml$)'; then
            echo "os=$all" >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi

  test:
    name: test (${{ matrix.os }})
    needs: platforms
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.platforms.outputs.os) }}
    steps:
      - uses: actions/checkout@v4

      # Unused toolchains in the image (Android SDK, .NET, GHC, CodeQL) are deleted in the
      # background: the space is free before the craft-fonts build needs it, and nothing waits.
      - name: Install Linux system dependencies (egui/winit/rfd)
        if: runner.os == 'Linux'
        run: |
          nohup sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL </dev/null >/dev/null 2>&1 &
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Only main saves caches; PRs restore main's. Every PR used to save its own set (up to
      # 3.8 GB), usable by that PR only, so the repo's 10 GB cache budget kept evicting main's.
      # A failing test still saves: the cache holds compiled dependencies, not test results.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      # `--features heif`: official builds open HEIC photos via the optional photocraft-heif crate.
      - name: Test
        run: cargo test --workspace --locked --features heif

      # The same codecs without the optional decoder: HEIC must stay a clear "not in this build"
      # error for distributors who leave it out.
      - name: Test without heif
        if: runner.os == 'Linux'
        run: cargo test -p photocraft-heif -p photocraft-codecs -p photocraft-io --locked

      # The same tests built with the optional craft-fonts input (crates/text/build.rs), so the
      # Japanese font tests that skip without it run here. Linux only. Keep the exact `--workspace
      # --features heif` of the Test step: any other package or feature selection resolves a
      # different feature set, recompiles the whole dependency graph into the same target dir and
      # runs the runner out of disk (as `-p photocraft-text -p photocraft-ui-egui` did after #800).
      - name: Check out craft-fonts
        if: runner.os == 'Linux'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: storytold/craft-fonts
          ref: abb83316d96aa59c1cf64784289e378fe9fa5695
          path: craft-fonts

      - name: Test with craft-fonts
        if: runner.os == 'Linux'
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: cargo test --workspace --locked --features heif

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --features heif -- -D warnings

      - name: Dependency layering
        run: cargo xtask layers

      # docs/scorecard.md must match its sources (checklists, budgets, baseline, corpus floors,
      # prefs audit). Static: it reads committed files only, no benchmarks run here.
      - name: Scorecard up to date
        if: runner.os == 'Linux'
        run: cargo xtask scorecard --check

  corpus:
    # Real-file corpus tests (cargo feature `corpus`), on every PR and on main. The corpora are
    # pinned in xtask/src/corpus_pins.rs and sha256-verified (xtask/*.sha256) after both a cache
    # restore and a download; a missing corpus fails the tests. The cache key changes only when a
    # pin or manifest does, so normally this restores in seconds (fork PRs read the base cache).
    name: corpus tests
    runs-on: ubuntu-latest
    env:
      # test-corpus builds with --release, but here without the release profile's thin LTO and
      # single codegen unit: they ran LTO over the dependency graph for each of the ~95 corpus test
      # binaries, so building took 23.5 of the job's 37 minutes while the tests ran for 1.5.
      # Turning them off builds 2.7x faster; the code under test is the same.
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: corpus
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Restore test corpora
        uses: actions/cache@v4
        with:
          path: corpus/
          key: corpus-${{ hashFiles('xtask/src/corpus_pins.rs', 'xtask/*.sha256') }}
      - name: Fetch and verify corpora
        run: cargo xtask corpus --all
      - name: Corpus tests
        run: cargo xtask test-corpus

  wasm:
    name: wasm32 check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Check wasm-safe crates
        run: cargo xtask wasm

  fuzz:
    name: fuzz (${{ matrix.target.crate }}/${{ matrix.target.name }})
    # Placeholder: manual trigger only until a nightly schedule is enabled.
    if: github.event_name == 'workflow_dispatch' && inputs.fuzz
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { crate: psd, name: parse }
          - { crate: psd, name: descriptor }
          - { crate: psd, name: image_source_data }
          - { crate: codecs, name: decode_any }
          - { crate: codecs, name: decode_png }
          - { crate: codecs, name: decode_jpeg }
          - { crate: codecs, name: decode_tiff }
          - { crate: codecs, name: decode_exr }
          - { crate: codecs, name: decode_heif }
          - { crate: format, name: load }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/${{ matrix.target.crate }}/fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz
        working-directory: crates/${{ matrix.target.crate }}
        run: cargo fuzz run ${{ matrix.target.name }} -- -max_total_time=${{ inputs.fuzz_seconds }}
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target.crate }}-${{ matrix.target.name }}
          path: crates/${{ matrix.target.crate }}/fuzz/artifacts

  amiga-document-parity:
    # Run the portable oracle when the Amiga port or Rust semantics change.
    name: PF Document C99 vs original Rust (SP-004/005/006)
    needs: platforms
    if: needs.platforms.outputs.port == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: C99 host contract and sanitizer
        run: |
          make -C ports/amigaos3 host-test
          make -C ports/amigaos3 host-core-sanitize
      - name: Unmodified original Rust Document unit tests
        run: cargo test -p photocraft-doc --locked --lib
      - name: Differential flat-layer Document output
        shell: bash
        run: |
          set -euo pipefail
          cargo run --quiet --manifest-path \
            ports/amigaos3/tests/rust_oracle/Cargo.toml -- document \
            > ports/amigaos3/build/oracle-rust-document.txt
          ports/amigaos3/build/document_oracle \
            > ports/amigaos3/build/oracle-c-document.txt
          diff -u ports/amigaos3/build/oracle-rust-document.txt \
                  ports/amigaos3/build/oracle-c-document.txt
          echo "PASS: original Rust Document shift and opacity vs C99"
          cargo run --quiet --manifest-path \
            ports/amigaos3/tests/rust_oracle/Cargo.toml -- group \
            > ports/amigaos3/build/oracle-rust-group.txt
          ports/amigaos3/build/group_oracle \
            > ports/amigaos3/build/oracle-c-group.txt
          diff -u ports/amigaos3/build/oracle-rust-group.txt \
                  ports/amigaos3/build/oracle-c-group.txt
          echo "PASS: original Rust Group order/clone vs C99"
      - name: Upload PF Document scoped oracle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pf-document-rust-c-parity
          path: |
            ports/amigaos3/build/oracle-rust-document.txt
            ports/amigaos3/build/oracle-c-document.txt
            ports/amigaos3/build/oracle-rust-group.txt
            ports/amigaos3/build/oracle-c-group.txt
          if-no-files-found: ignore

  amiga-document-m68k:
    name: PF Document GCC13 O0/O2 vamos (SP-004/005/006)
    needs: [platforms, amiga-document-parity]
    if: needs.platforms.outputs.port == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GCC13_IMAGE: stefanreinauer/amiga-gcc:gcc-v13.3-20260622
    steps:
      - uses: actions/checkout@v4
      - name: Pin GCC13.3 compiler image and record digest
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$GCC13_IMAGE"
          docker image inspect "$GCC13_IMAGE" --format '{{json .RepoDigests}}'
      - name: Compile flat document contract at O0 and O2 as real HUNK
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 \
            --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work \
            "$GCC13_IMAGE" /bin/sh -ec '
              compiler="$(command -v m68k-amigaos-gcc)"
              root="$(dirname "$(dirname "$(realpath "$compiler")")")"
              make -C ports/amigaos3 gcc13-build-typed GCC_BEBBO_ROOT="$root"
            '
          make -C ports/amigaos3 gcc13-check-typed-hunks
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned machine68k/vamos test runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install greenlet
          python -m pip install \
            'git+https://github.com/cnvogelg/machine68k.git@61600df53cb007e06b9f3c576d1c4b1d19042ef4'
          python -m pip install \
            'git+https://github.com/cnvogelg/amitools.git@3b57f2052ee76c28bbc5e4256227f62dca7b1c9f'
          vamos --help >/dev/null
      - name: Run extended m68k flat Document test at O0/O2
        shell: bash
        run: |
          set -euo pipefail
          cd ports/amigaos3
          for opt in O0 O2; do
            dir="build/m68k-gcc13/$opt"
            mkdir -p "$dir/logs"
            vamos -S -C 20 -m 8192 -s 128 "$dir/pc_document_test" \
              > "$dir/logs/pc_document_test.log" 2>&1
            cat "$dir/logs/pc_document_test.log"
            grep -qx 'PASS: PhotoCraft flat raster-layer document ownership/order/COW/opacity/shift' \
              "$dir/logs/pc_document_test.log"
            echo "PASS: GCC13 $opt flat Document shift and opacity"
          done
      - name: Keep m68k regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pf-document-gcc13-vamos
          path: ports/amigaos3/build/m68k-gcc13/**/logs/pc_document_test.log
          if-no-files-found: ignore
